<!DOCTYPE html>
<html lang="es-CL">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Panel de la clínica</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0A1F3C">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%230B63CE' d='M7.5 2C4.6 2 3 4.2 3 7c0 2.4.9 3.7 1.4 6.3.5 2.7.6 8.7 2.9 8.7 1.9 0 1.6-5.5 4.7-5.5s2.8 5.5 4.7 5.5c2.3 0 2.4-6 2.9-8.7C20.1 10.7 21 9.4 21 7c0-2.8-1.6-5-4.5-5-1.9 0-2.9 1-4.5 1s-2.6-1-4.5-1z'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&family=DM+Sans:wght@400;500;700&display=swap">
<script>try { var t = localStorage.getItem("tema"); if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t); } catch (e) {}</script>
<link rel="stylesheet" href="admin/app.css">
</head>
<body>

<!-- Ingreso -->
<div class="login" id="v-login" hidden>
  <form class="box" id="f-login" novalidate>
    <h1>Panel de la clínica</h1>
    <p style="color:var(--text-3)">Ingrese con su cuenta de administrador.</p>
    <label class="field"><span>Correo</span><input type="email" id="l-mail" autocomplete="username" required></label>
    <label class="field"><span>Contraseña</span><input type="password" id="l-pass" autocomplete="current-password" required></label>
    <p class="msg bad" id="l-err" role="alert" hidden></p>
    <button class="btn lg" type="submit" id="l-btn">Entrar</button>
    <a href="index.html" style="font-size:13.5px">Volver a la página</a>
  </form>
</div>

<!-- Sin conexión -->
<div class="login" id="v-off" hidden>
  <div class="box">
    <h1 id="off-t">Falta conectar la base de datos</h1>
    <p id="off-p">Para usar el panel, pegue la dirección y la clave pública de Supabase en el archivo conexion.js. Los pasos están en el README.</p>
    <button class="btn" type="button" onclick="location.reload()">Reintentar</button>
  </div>
</div>

<!-- Aplicación -->
<div class="app" id="v-app" hidden>
  <aside class="side" id="side" aria-label="Menú">
    <div class="brand"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7.5 2C4.6 2 3 4.2 3 7c0 2.4.9 3.7 1.4 6.3.5 2.7.6 8.7 2.9 8.7 1.9 0 1.6-5.5 4.7-5.5s2.8 5.5 4.7 5.5c2.3 0 2.4-6 2.9-8.7C20.1 10.7 21 9.4 21 7c0-2.8-1.6-5-4.5-5-1.9 0-2.9 1-4.5 1s-2.6-1-4.5-1z"/></svg><span id="s-nombre">Clínica</span></div>
    <nav id="s-nav" aria-label="Secciones"></nav>
    <div class="foot">
      <button class="nav" type="button" id="b-tema"></button>
      <a class="nav" href="index.html" target="_blank" rel="noopener" id="b-ver"></a>
      <button class="nav" type="button" id="b-salir"></button>
      <div class="who" id="s-who"></div>
    </div>
  </aside>
  <div class="main">
    <header class="bar">
      <button class="btn ghost icon menu" type="button" id="b-menu" aria-label="Abrir menú"></button>
      <h1 id="b-titulo">Inicio</h1>
      <span class="live" id="b-live" title="Las reservas nuevas aparecen solas"><i></i><span>En vivo</span></span>
      <button class="search" type="button" id="b-buscar" aria-label="Buscar (Ctrl + K)"></button>
      <button class="btn new" type="button" id="b-nueva"></button>
    </header>
    <main class="page" id="vista" tabindex="-1"></main>
  </div>
</div>

<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="drawer" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="d-titulo"></aside>
<div class="palette" id="palette" hidden role="dialog" aria-modal="true" aria-label="Buscar"></div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<div class="tip" id="tip" aria-hidden="true"></div>
<div class="savebar" id="savebar" role="region" aria-label="Cambios sin guardar"><p id="save-msg">Tiene cambios sin guardar</p><button class="btn sec" type="button" id="b-descartar">Descartar</button><button class="btn" type="button" id="b-guardar">Guardar cambios</button></div>

<script src="conexion.js"></script>
<script src="admin/app.js"></script>
<script src="admin/editor.js"></script>
</body>
</html>
